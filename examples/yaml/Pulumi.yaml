name: mox-example
runtime: yaml
description: Smoke example for the native mox provider.

# Provider config is set on the stack, not declared here:
#   pulumi config set mox:adminUrl https://mox-admin.example.com
#   pulumi config set --secret mox:adminPassword <password>
# (or via the MOX_ADMIN_URL / MOX_ADMIN_PASSWORD environment variables).

variables:
  # This is read-only because mox exposes CheckUpdates from static mox.conf via
  # the admin API, but does not expose an API setter for it.
  updateCheck:
    fn::invoke:
      function: mox:index:getCheckUpdatesEnabled
      arguments: {}

resources:
  example:
    type: mox:Domain
    properties:
      domain: example.com
      # account defaults to the domain name; localpart defaults to "postmaster".

  # A second account on the domain, beyond the postmaster account that adding the
  # domain creates. Referencing ${example.domain} makes Pulumi create this account
  # after the domain (and, on destroy, tear it down before the domain).
  testuser:
    type: mox:Account
    properties:
      account: testuser
      address: testuser@${example.domain}
      # No password supplied: the provider generates one on create and exposes
      # it as the effectivePassword secret output (see testUserPassword below).
      # To set your own instead, add `password: <value>` here.

  testlist:
    type: mox:Alias
    properties:
      address: list@${example.domain}
      members:
        - ${testuser.address}
      postPublic: false

  pulumiDkim:
    type: mox:DomainDKIMSelector
    properties:
      domain: ${example.domain}
      selector: pulumi
      algorithm: ed25519
      hash: sha256
      headerRelaxed: true
      bodyRelaxed: true
      sealHeaders: true
      headers:
        - from
        - subject
        - date
        - message-id
      lifetimeSeconds: 1209600
      sign: true

  testuser2:
    type: mox:Account
    properties:
      account: testuser2
      address: testuser2@${example.domain}
      password: mysecretpassword

  globalRoutes:
    type: mox:GlobalRoutes
    properties:
      # Exercise the global RoutesSave API. localserve has no named transports,
      # so the smoke stack keeps the desired global route list empty. See
      # examples/yaml-advanced for non-empty routes.
      routes: []

  webserver:
    type: mox:WebserverConfig
    properties:
      # Dynamic domains.conf web config: redirects and ordered handlers.
      redirects:
        - from: old-web.example.com
          to: new-web.example.com
      handlers:
        - logName: example-redirect
          domain: web.example.com
          pathRegexp: ^/
          dontRedirectPlainHTTP: true
          redirect:
            baseUrl: https://www.example.com/

  webadminDebug:
    type: mox:LogLevel
    properties:
      # Package-specific log-level override, cleared again on destroy.
      package: webadmin
      level: debug

  dnsblMonitoring:
    type: mox:DNSBLMonitoring
    properties:
      # Extra DNSBLs to monitor for our outgoing IPs. This does not make mox use
      # them to reject incoming mail; that is static listener config in mox.conf.
      zones:
        - dnsbl.example.com

  forwardingSieve:
    type: mox:Sieve
    properties:
      account: ${testuser.account}
      name: forwarding
      active: false
      content: |
        require ["fileinto"];
        fileinto "Inbox";

outputs:
  # The mox-generated zone-file lines (MX, SPF, DKIM, DMARC, ...). Feed these
  # into your DNS provider (e.g. Cloudflare).
  dnsRecords: ${example.dnsRecords}
  # The address of the extra account created above.
  testUserAddress: ${testuser.address}
  # The generated account password (secret). Retrieve with:
  #   pulumi stack output testUserPassword --show-secrets
  testUserPassword: ${testuser.effectivePassword}
  aliasAddress: ${testlist.address}
  dkimSelector: ${pulumiDkim.selector}
  dkimPrivateKeyFile: ${pulumiDkim.privateKeyFile}
  webRedirects: ${webserver.redirects}
  dnsblZones: ${dnsblMonitoring.zones}
  checkUpdatesEnabled: ${updateCheck.enabled}
